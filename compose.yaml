services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: PostgreSQL
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__PostgreSQLConnection: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: TaskManagementAPI
      Jwt__Audience: TaskManagementClient
      Cors__AllowedOrigins__0: https://${APP_HOST:?APP_HOST is required}
      Storage__UploadPath: /app/uploads
      Storage__MaxFileSizeBytes: "10485760"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: TaskManagement.Web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  uploads:
